target: all

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  ring:
    instance_addr: tempo
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    address: tempo
    port: 9095
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  max_block_duration: 5m

querier: {}

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
