auth_enabled: false

server:
  http_listen_port: 3100

limits_config:
  # Для OTLP ingestion и structured metadata (в Loki 3.x без этого либо не стартует, либо режет OTLP)
  allow_structured_metadata: true
  retention_period: 168h

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Локальное хранилище чанков
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
