[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dopdoc-ingestion-service"
version = "0.1.0"
description = "DopDocAI ingestion service and index worker"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "httpx>=0.27.0,<0.28.0",
  "gitpython>=3.1.43,<4.0.0",
  "minio>=7.2.8,<8.0.0",
  "psycopg[binary]>=3.2.3,<4.0.0",
  "tree-sitter==0.25.2",
  "tree-sitter-go>=0.25.0,<0.26.0",
]

[project.optional-dependencies]
retrieval = [
  "qdrant-client>=1.11.0,<2.0.0",
]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.23.8,<0.24.0",
  "ruff>=0.6.0,<0.7.0",
  "mypy>=1.11.0,<2.0.0",
]

[project.scripts]
ingestion-api = "app.main:main"
ingestion-worker = "app.worker.index_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
