services:
  postgres:
    image: postgres:16
    container_name: dopdoc_postgres
    environment:
      POSTGRES_DB: dopdoc
      POSTGRES_USER: dopdoc
      POSTGRES_PASSWORD: dopdoc
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopdoc -d dopdoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dopdoc_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # optional UI/metrics
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__STORAGE_TYPE=rocksdb

  # ---------------------------
  # MinIO (S3 storage for artifacts)
  # ---------------------------
  minio:
    image: minio/minio:latest
    container_name: dopdoc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dopdoc
      MINIO_ROOT_PASSWORD: dopdocstorage
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Автосоздание бакетов (после старта MinIO)
  minio_init:
    image: minio/mc:latest
    container_name: dopdoc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dopdoc dopdocstorage &&
      mc mb -p local/dopdoc-artifacts || true &&
      mc anonymous set download local/dopdoc-artifacts || true &&
      echo 'MinIO buckets ensured.'"
    restart: "no"

  # ---------------------------
  # Observability (Otel + Prometheus + Grafana + Loki + Tempo)
  # ---------------------------
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: dopdoc_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics export (если включим)
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: dopdoc_prometheus
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel_collector:
        condition: service_started

  loki:
    image: grafana/loki:latest
    container_name: dopdoc_loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.1
    container_name: dopdoc_tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4319:4317"   # (опционально) отдельный OTLP вход в tempo
      - "4320:4318"

  grafana:
    image: grafana/grafana:latest
    container_name: dopdoc_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: dopdoc
      GF_SECURITY_ADMIN_PASSWORD: dopdoc
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # ---------------------------
  # Microservices
  # ---------------------------
  embedding_service:
    profiles: ["embeddings"]
    build:
      context: .
      dockerfile: src/services/embedding_service/Dockerfile
    container_name: dopdoc_embedding_service
    environment:
      EMBED_MODEL_NAME: jinaai/jina-code-embeddings-0.5b
      EMBED_VECTOR_SIZE: "896"
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-8}
      EMBED_TRUST_REMOTE_CODE: "true"
      EMBED_ACCESS_LOG: ${EMBED_ACCESS_LOG:-false}
      EMBED_LOG_LEVEL: ${EMBED_LOG_LEVEL:-info}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    ports:
      - "19400:19400"
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19400/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 120s

  ingestion_service:
    build:
      context: .
      dockerfile: src/services/ingestion_service/Dockerfile.dev
    container_name: dopdoc_ingestion_service
    environment:
      INGEST_REPOS_SERVICE_URL: http://repository_service:19200
      INGEST_DATABASE_URL: ${INGEST_DATABASE_URL}
      INGEST_REPO_DB_SCHEMA: repo
      INGEST_PORT: 19100
      INGEST_QDRANT_URL: http://qdrant:6333
      INGEST_QDRANT_CODE_CHUNKS_COLLECTION: code_chunks_v1
      INGEST_EMBEDDING_PROVIDER: ${INGEST_EMBEDDING_PROVIDER:-hash}
      INGEST_EMBEDDING_MODEL: jinaai/jina-code-embeddings-0.5b
      INGEST_EMBEDDING_VECTOR_SIZE: "896"
      INGEST_EMBEDDING_SERVICE_URL: ${INGEST_EMBEDDING_SERVICE_URL:-http://embedding_service:19400}

      # MinIO (артефакты типа go_symbols.json, опционально)
      DOPDOC_S3_ENDPOINT: http://minio:9000
      DOPDOC_S3_ACCESS_KEY: dopdoc
      DOPDOC_S3_SECRET_KEY: dopdocstorage
      DOPDOC_S3_BUCKET: dopdoc-artifacts
      DOPDOC_S3_REGION: us-east-1

      # OTEL (позже подключим в коде)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4317
      OTEL_SERVICE_NAME: ingestion_service
    ports:
      - "19100:19100"
    volumes:
      - ./src/services/ingestion_service:/app/src/services/ingestion_service
    depends_on:
      repository_service:
        condition: service_started
      qdrant:
        condition: service_started

  ingestion_worker:
    build:
      context: .
      dockerfile: src/services/ingestion_service/Dockerfile.dev
    container_name: dopdoc_ingestion_worker
    command: ["ingestion-worker"]
    environment:
      INGEST_REPOS_SERVICE_URL: http://repository_service:19200
      INGEST_DATABASE_URL: ${INGEST_DATABASE_URL}
      INGEST_REPO_DB_SCHEMA: repo
      INGEST_WORKER_POLL_INTERVAL_S: "3"
      INGEST_WORKER_LEASE_SECONDS: "120"
      INGEST_WORKER_HEARTBEAT_SECONDS: "15"
      INGEST_CLONE_ROOT: /tmp/dopdoc-index-worker
      INGEST_REQUEST_TIMEOUT_S: "10"
      INGEST_QDRANT_URL: http://qdrant:6333
      INGEST_QDRANT_CODE_CHUNKS_COLLECTION: code_chunks_v1
      INGEST_QDRANT_UPSERT_BATCH_SIZE: "64"
      INGEST_EMBEDDING_PROVIDER: ${INGEST_EMBEDDING_PROVIDER:-hash}
      INGEST_EMBEDDING_MODEL: jinaai/jina-code-embeddings-0.5b
      INGEST_EMBEDDING_VECTOR_SIZE: "896"
      INGEST_EMBEDDING_BATCH_SIZE: "32"
      INGEST_EMBEDDING_SERVICE_URL: ${INGEST_EMBEDDING_SERVICE_URL:-http://embedding_service:19400}
      INGEST_EMBEDDING_REQUEST_TIMEOUT_S: "120"
      INGEST_EMBEDDING_MAX_ATTEMPTS: "5"
      INGEST_EMBEDDING_RETRY_DELAY_S: "2"

      DOPDOC_S3_ENDPOINT: http://minio:9000
      DOPDOC_S3_ACCESS_KEY: dopdoc
      DOPDOC_S3_SECRET_KEY: dopdocstorage
      DOPDOC_S3_BUCKET: dopdoc-artifacts
      DOPDOC_S3_REGION: us-east-1
      DOPDOC_S3_UPLOAD_MAX_ATTEMPTS: "5"
      DOPDOC_S3_UPLOAD_RETRY_DELAY_S: "1"

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4317
      OTEL_SERVICE_NAME: ingestion_worker
    volumes:
      - ./src/services/ingestion_service:/app/src/services/ingestion_service
    depends_on:
      postgres:
        condition: service_healthy
      repository_service:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully

  documentation_service:
    build:
      context: .
      dockerfile: src/services/documentation_service/Dockerfile
    container_name: dopdoc_documentation_service
    environment:
      DOCS_DATABASE_URL: ${DOCS_DATABASE_URL}
      DOCS_REPO_DB_SCHEMA: repo
      DOCS_PORT: 19500

      DOPDOC_S3_ENDPOINT: http://minio:9000
      DOPDOC_S3_ACCESS_KEY: dopdoc
      DOPDOC_S3_SECRET_KEY: dopdocstorage
      DOPDOC_S3_BUCKET: dopdoc-artifacts
      DOPDOC_S3_REGION: us-east-1

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4317
      OTEL_SERVICE_NAME: documentation_service
    ports:
      - "19500:19500"
    volumes:
      - ./src/services/documentation_service:/app/src/services/documentation_service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully

  documentation_worker:
    build:
      context: .
      dockerfile: src/services/documentation_service/Dockerfile
    container_name: dopdoc_documentation_worker
    command: ["documentation-worker"]
    environment:
      DOCS_DATABASE_URL: ${DOCS_DATABASE_URL}
      DOCS_REPO_DB_SCHEMA: repo
      DOCS_WORKER_POLL_INTERVAL_S: "3"
      DOCS_WORKER_LEASE_SECONDS: "120"
      DOCS_WORKER_HEARTBEAT_SECONDS: "15"
      DOCS_S3_VALIDATE_ON_START: "true"

      DOPDOC_S3_ENDPOINT: http://minio:9000
      DOPDOC_S3_ACCESS_KEY: dopdoc
      DOPDOC_S3_SECRET_KEY: dopdocstorage
      DOPDOC_S3_BUCKET: dopdoc-artifacts
      DOPDOC_S3_REGION: us-east-1

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4317
      OTEL_SERVICE_NAME: documentation_worker
    volumes:
      - ./src/services/documentation_service:/app/src/services/documentation_service
    depends_on:
      postgres:
        condition: service_healthy
      repository_service:
        condition: service_started
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully

  auth_service:
    build:
      context: .
      dockerfile: src/services/DopDoc.AuthService/Dockerfile
    container_name: dopdoc_auth_service
    ports:
      - "19000:19000"
    environment:
      ConnectionStrings__AuthDb: ${AUTH_DB_CONNECTION}
      Db__Schema: auth
      
      Health__Ready__Postgres__Enabled: true
      Health__Ready__Postgres__ConnectionName: AuthDb
      Health__Ready__Postgres__TimeoutSeconds: 2
      Health__Ready__Minio__Enabled: false
      Health__Ready__Qdrant__Enabled: false
      
      Auth__JwtSecret: ${AUTH_JWT_SECRET}
      Auth__RefreshPepper: ${AUTH_REFRESH_PEPPER}
      Auth__JwtIssuer: dopdoc
      Auth__JwtAudience: dopdoc
      Auth__AccessTokenMinutes: 120
      Auth__RefreshTokenDays: 30
      Auth__RefreshCookieName: dopdoc_refresh_token
      Auth__RefreshCookiePath: /api/v1/auth
      Auth__RefreshCookieDomain: null
      Auth__RefreshCookieSecure: true
      Auth__RefreshCookieSameSite: Strict
      
      Otel__ServiceName: auth_service
      Otel__ExporterOtlpEndpoint: http://otel_collector:4317
      Otel__EnableTracing: true
      Otel__EnableMetrics: true
      
      Correlation__HeaderName: X-Correlation-Id
      Correlation__UseTraceIdAsCorrelationId: false
      
      Serilog__MinimumLevel__Default: Information
    depends_on:
      postgres:
        condition: service_healthy
      repository_service:
        condition: service_started
      ingestion_service:
        condition: service_started
      otel_collector:
        condition: service_started

  repository_service:
    build:
      context: .
      dockerfile: src/services/DopDoc.RepositoryService/Dockerfile
    container_name: dopdoc_repository_service
    ports:
      - "19200:19200"
    environment:
      ConnectionStrings__RepoDb: ${REPO_DB_CONNECTION}
      Db__Schema: repo
      Jobs__MaxAttempts: 3
      Jobs__LeaseSeconds: 120
      Jobs__HeartbeatSeconds: 15

      Health__Ready__Postgres__Enabled: true
      Health__Ready__Postgres__ConnectionName: RepoDb
      Health__Ready__Postgres__TimeoutSeconds: 2
      Health__Ready__Minio__Enabled: false
      Health__Ready__Qdrant__Enabled: false

      Otel__ServiceName: repository_service
      Otel__ExporterOtlpEndpoint: http://otel_collector:4317
      Otel__EnableTracing: true
      Otel__EnableMetrics: true

      Correlation__HeaderName: X-Correlation-Id
      Correlation__UseTraceIdAsCorrelationId: false

      Serilog__MinimumLevel__Default: Information
    depends_on:
      postgres:
        condition: service_healthy
      otel_collector:
        condition: service_started

  chat_service:
    build:
      context: .
      dockerfile: src/services/DopDoc.ChatService/Dockerfile
    container_name: dopdoc_chat_service
    ports:
      - "19300:19300"
    environment:
      ConnectionStrings__ChatDb: ${CHAT_DB_CONNECTION}
      Db__Schema: chat
      RepositoryService__BaseUrl: http://repository_service:19200
      RepositoryService__TimeoutSeconds: 10
      Retrieval__BaseUrl: http://ingestion_service:19100
      Retrieval__TimeoutSeconds: 60
      Retrieval__TopK: ${CHAT_RETRIEVAL_TOP_K:-8}
      Retrieval__IncludeTests: ${CHAT_RETRIEVAL_INCLUDE_TESTS:-true}
      Llm__Provider: ${CHAT_LLM_PROVIDER:-stub}
      Llm__Endpoint: ${CHAT_LLM_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      Llm__ApiKey: ${CHAT_LLM_API_KEY:-}
      Llm__Model: ${CHAT_LLM_MODEL:-deepseek/deepseek-v3.2}
      Llm__TimeoutSeconds: ${CHAT_LLM_TIMEOUT_SECONDS:-60}
      Llm__Temperature: ${CHAT_LLM_TEMPERATURE:-0.2}
      Llm__MaxTokens: ${CHAT_LLM_MAX_TOKENS:-1536}
      Llm__TopP: ${CHAT_LLM_TOP_P:-0.95}
      Llm__RepetitionPenalty: ${CHAT_LLM_REPETITION_PENALTY:-1.05}
      Llm__HistoryLimit: ${CHAT_LLM_HISTORY_LIMIT:-20}
      Llm__MaxSourceChars: ${CHAT_LLM_MAX_SOURCE_CHARS:-24000}

      Health__Ready__Postgres__Enabled: true
      Health__Ready__Postgres__ConnectionName: ChatDb
      Health__Ready__Postgres__TimeoutSeconds: 2
      Health__Ready__Minio__Enabled: false
      Health__Ready__Qdrant__Enabled: false

      Otel__ServiceName: chat_service
      Otel__ExporterOtlpEndpoint: http://otel_collector:4317
      Otel__EnableTracing: true
      Otel__EnableMetrics: true

      Correlation__HeaderName: X-Correlation-Id
      Correlation__UseTraceIdAsCorrelationId: false

      Serilog__MinimumLevel__Default: Information
    depends_on:
      postgres:
        condition: service_healthy
      otel_collector:
        condition: service_started

  edge_gateway:
    build:
      context: .
      dockerfile: src/services/DopDoc.EdgeGateway/Dockerfile
    container_name: dopdoc_edge_gateway
    ports:
      - "18000:18000"
    environment:
      Auth__JwtSecret: ${AUTH_JWT_SECRET}
      Auth__JwtIssuer: dopdoc
      Auth__JwtAudience: dopdoc

      Health__Ready__Postgres__Enabled: false
      Health__Ready__Minio__Enabled: false
      Health__Ready__Qdrant__Enabled: false

      ReverseProxy__Clusters__auth__Destinations__d1__Address: http://auth_service:19000/
      ReverseProxy__Clusters__repos__Destinations__d1__Address: http://repository_service:19200/
      ReverseProxy__Clusters__chats__Destinations__d1__Address: http://chat_service:19300/
      ReverseProxy__Clusters__ingestion__Destinations__d1__Address: http://ingestion_service:19100/

      Otel__ServiceName: edge_gateway
      Otel__ExporterOtlpEndpoint: http://otel_collector:4317
      Otel__EnableTracing: true
      Otel__EnableMetrics: true

      Correlation__HeaderName: X-Correlation-Id
      Correlation__UseTraceIdAsCorrelationId: false

      Serilog__MinimumLevel__Default: Information
    depends_on:
      auth_service:
        condition: service_started
      repository_service:
        condition: service_started
      chat_service:
        condition: service_started
      ingestion_service:
        condition: service_started
      otel_collector:
        condition: service_started

volumes:
  pg_data:
  qdrant_data:
  minio_data:
  grafana_data:
  embedding_models:

networks:
  default:
    external: true
    name: dopdocai_default
