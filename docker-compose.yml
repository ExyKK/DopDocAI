services:
  postgres:
    image: postgres:16
    container_name: dopdoc_postgres
    environment:
      POSTGRES_DB: dopdoc
      POSTGRES_USER: dopdoc
      POSTGRES_PASSWORD: dopdoc
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
#      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopdoc -d dopdoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dopdoc_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # optional UI/metrics
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__STORAGE_TYPE=rocksdb

  # ---------------------------
  # MinIO (S3 storage for artifacts)
  # ---------------------------
  minio:
    image: minio/minio:latest
    container_name: dopdoc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dopdoc
      MINIO_ROOT_PASSWORD: dopdocstorage
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Автосоздание бакетов (после старта MinIO)
  minio_init:
    image: minio/mc:latest
    container_name: dopdoc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dopdoc dopdocstorage &&
      mc mb -p local/dopdoc-artifacts || true &&
      mc anonymous set download local/dopdoc-artifacts || true &&
      echo 'MinIO buckets ensured.'"
    restart: "no"

  # ---------------------------
  # Observability (Otel + Prometheus + Grafana + Loki + Tempo)
  # ---------------------------
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: dopdoc_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics export (если включим)
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: dopdoc_prometheus
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel_collector:
        condition: service_started

  loki:
    image: grafana/loki:latest
    container_name: dopdoc_loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.1
    container_name: dopdoc_tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4319:4317"   # (опционально) отдельный OTLP вход в tempo
      - "4320:4318"

  grafana:
    image: grafana/grafana:latest
    container_name: dopdoc_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: dopdoc
      GF_SECURITY_ADMIN_PASSWORD: dopdoc
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # ---------------------------
  # Microservices
  # ---------------------------
  ingestion_service:
    build:
      context: .
      dockerfile: src/services/ingestion_service/Dockerfile.dev
    container_name: dopdoc_ingestion_service
    environment:
      INGEST_REPOS_SERVICE_URL: http://repository_service:19200
      INGEST_DATABASE_URL: postgresql://dopdoc:dopdoc@postgres:5432/dopdoc
      INGEST_REPO_DB_SCHEMA: repo
      INGEST_QDRANT_URL: http://qdrant:6333
      INGEST_QDRANT_API_KEY: ""
      INGEST_PORT: 19100

      # MinIO (артефакты типа go_symbols.json, опционально)
      DOPDOC_S3_ENDPOINT: http://minio:9000
      DOPDOC_S3_ACCESS_KEY: dopdoc
      DOPDOC_S3_SECRET_KEY: dopdocstorage
      DOPDOC_S3_BUCKET: dopdoc-artifacts
      DOPDOC_S3_REGION: us-east-1

      # OTEL (позже подключим в коде)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4317
      OTEL_SERVICE_NAME: ingestion_service

      # ML params
      INGEST_JINA_MODEL: jinaai/jina-code-embeddings-0.5b
      INGEST_MAX_TOKENS: "512"
      INGEST_OVERLAP: "64"
      INGEST_VECTOR_SIZE: "896"
      INGEST_QDRANT_BATCH_SIZE: "64"
      HF_HOME: /hf_cache
      TRANSFORMERS_CACHE: /hf_cache/transformers
      SENTENCE_TRANSFORMERS_HOME: /hf_cache/sentence_transformers
    ports:
      - "19100:19100"
    volumes:
      - ./src/services/ingestion_service:/app/src/services/ingestion_service
      - hf_cache:/hf_cache
    depends_on:
      repository_service:
        condition: service_started
      qdrant:
        condition: service_started

  ingestion_worker:
    build:
      context: .
      dockerfile: src/services/ingestion_service/Dockerfile.dev
    container_name: dopdoc_ingestion_worker
    command: ["ingestion-worker"]
    environment:
      INGEST_REPOS_SERVICE_URL: http://repository_service:19200
      INGEST_DATABASE_URL: postgresql://dopdoc:dopdoc@postgres:5432/dopdoc
      INGEST_REPO_DB_SCHEMA: repo
      INGEST_WORKER_POLL_INTERVAL_S: "3"
      INGEST_WORKER_LEASE_SECONDS: "120"
      INGEST_WORKER_HEARTBEAT_SECONDS: "15"
      INGEST_CLONE_ROOT: /tmp/dopdoc-index-worker
      INGEST_REQUEST_TIMEOUT_S: "10"

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4317
      OTEL_SERVICE_NAME: ingestion_worker
    volumes:
      - ./src/services/ingestion_service:/app/src/services/ingestion_service
    depends_on:
      postgres:
        condition: service_healthy
      repository_service:
        condition: service_started

